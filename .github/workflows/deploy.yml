name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            班主任模拟器/package-lock.json
            炸弹人大赛/package-lock.json

      # ---- 班主任模拟器 ----
      - name: Install (class-teacher)
        working-directory: 班主任模拟器
        run: npm ci

      - name: Build (class-teacher)
        working-directory: 班主任模拟器
        run: npm run build

      # ---- 炸弹人大赛 ----
      - name: Install (bomb contest)
        working-directory: 炸弹人大赛
        run: npm ci

      - name: Build (bomb contest)
        working-directory: 炸弹人大赛
        run: npm run web:build

      # 把炸弹人的产物放进游戏站的子路径，一起发布
      - name: Assemble site
        run: |
          mkdir -p site/class-sim
          cp -r 班主任模拟器/dist/. site/class-sim/
          mkdir -p site/class-sim/bomb-contest
          cp -r 炸弹人大赛/dist/. site/class-sim/bomb-contest/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
