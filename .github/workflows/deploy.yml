name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            班主任模拟器/package-lock.json
            炸弹人大赛/package-lock.json
            五子棋/package-lock.json
            赛车/package-lock.json

      # ---- 班主任模拟器 ----
      - name: Install (class-teacher)
        working-directory: 班主任模拟器
        run: npm ci

      - name: Build (class-teacher)
        working-directory: 班主任模拟器
        run: npm run build

      # ---- 炸弹人大赛 ----
      - name: Install (bomb contest)
        working-directory: 炸弹人大赛
        run: npm ci

      - name: Build (bomb contest)
        working-directory: 炸弹人大赛
        run: npm run web:build

      # ---- 五子棋 ----
      - name: Install (gomoku)
        working-directory: 五子棋
        run: npm ci

      - name: Build (gomoku)
        working-directory: 五子棋
        run: npm run web:build

      # ---- 赛车 ----
      - name: Install (racing)
        working-directory: 赛车
        run: npm ci

      - name: Build (racing)
        working-directory: 赛车
        run: npm run web:build

      # ---- 聊天室（全屏页） ----
      - name: Install (chat)
        working-directory: chat
        run: npm ci

      - name: Build (chat)
        working-directory: chat
        run: npm run build

      # 这个仓库发布在 /class-sim/，所以产物根目录就是它本身
      - name: Assemble site
        run: |
          mkdir -p site/bomb-contest site/gomoku site/racing site/chat
          cp -r 班主任模拟器/dist/. site/
          cp -r 炸弹人大赛/dist/. site/bomb-contest/
          cp -r 五子棋/dist/. site/gomoku/
          cp -r 赛车/dist/. site/racing/
          cp -r chat/dist/. site/chat/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
